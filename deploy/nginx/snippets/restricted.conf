# Gate for /admin and write APIs.
# Basic Auth is always required. To ALSO pin access to known IPs, uncomment the
# allow/deny lines and set your address(es); `satisfy all` then requires both.

satisfy all;

# allow 203.0.113.10;      # <- your office/home IP (real IP, restored from Cloudflare)
# allow 2001:db8::/48;
# deny all;

auth_basic           "benichi.dev admin";
auth_basic_user_file /etc/nginx/htpasswd;
