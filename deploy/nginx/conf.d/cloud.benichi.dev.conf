# cloud.benichi.dev -> Aria Cloud (container aria-cloud-nextjs:3000, basePath /cloud)
upstream aria_app {
    server aria-cloud-nextjs:3000;
    keepalive 32;
}

# ---------- HTTP :80 ----------
server {
    listen 80;
    listen [::]:80;
    server_name cloud.benichi.dev www.cloud.benichi.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }
    location / { return 301 https://cloud.benichi.dev$request_uri; }
}

# ---------- HTTPS :443 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cloud.benichi.dev www.cloud.benichi.dev;

    ssl_certificate     /etc/letsencrypt/live/cloud.benichi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.benichi.dev/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    client_max_body_size 110m;

    if ($host = www.cloud.benichi.dev) { return 301 https://cloud.benichi.dev$request_uri; }

    location = / { return 302 /cloud; }

    location / {
        proxy_pass http://aria_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
