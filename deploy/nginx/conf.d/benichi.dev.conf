upstream benichi_app {
    server app:3000;
    keepalive 32;
}

# ---------- HTTP :80 ----------
server {
    listen 80;
    listen [::]:80;
    server_name benichi.dev www.benichi.dev;

    # ACME HTTP-01 challenge — always served over plain HTTP, never redirected,
    # so Let's Encrypt renewals keep working even with the Cloudflare proxy on.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS :443 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name benichi.dev www.benichi.dev;

    ssl_certificate     /etc/letsencrypt/live/benichi.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benichi.dev/privkey.pem;
    include /etc/nginx/snippets/ssl.conf;

    # Redirect the www host to the apex.
    if ($host = www.benichi.dev) {
        return 301 https://benichi.dev$request_uri;
    }

    client_max_body_size 12m;

    # --- Restricted: admin panel (pages + their server-action POSTs) ---
    location /admin {
        include /etc/nginx/snippets/restricted.conf;
        proxy_pass http://benichi_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Restricted: portfolio JSON API (read endpoint; keep private) ---
    location = /api/portfolio {
        include /etc/nginx/snippets/restricted.conf;
        proxy_pass http://benichi_app;
        include /etc/nginx/snippets/proxy.conf;
    }

    # --- Public ---
    location / {
        proxy_pass http://benichi_app;
        include /etc/nginx/snippets/proxy.conf;
    }
}
